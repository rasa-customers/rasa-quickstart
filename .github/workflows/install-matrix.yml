name: install-matrix

# Runs the real bootstrap on every OS against the *current checkout* (via a
# local tarball, so PRs test their own code, not main). Provisions through
# `rasa data validate`; training is skipped (no LLM key needed).
#
# Requires repo secret: RASA_LICENSE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    # Fork PRs don't receive secrets, so the bootstrap can't get past the
    # license check — skip instead of failing on every external contribution.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RASA_LICENSE: ${{ secrets.RASA_LICENSE }}
      RASA_QUICKSTART_TARBALL: local.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Build local tarball (GitHub-style layout)
        shell: bash
        run: |
          mkdir -p _ci/rasa-quickstart-ci
          cp -R template _ci/rasa-quickstart-ci/template
          tar -czf local.tar.gz -C _ci rasa-quickstart-ci

      - name: Bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh --ides claude --yes --skip-train agent

      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -Force Bypass
          ./install.ps1 -Ides claude -Yes -SkipTrain agent

      - name: Assert delivered files exist
        shell: bash
        working-directory: agent
        run: |
          for f in config.yml endpoints.yml Makefile pyproject.toml .env .gitignore scripts/setup.py; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          test -d .claude/skills || { echo "skills not installed"; exit 1; }
          echo "delivered files present"

      - name: Validate project
        shell: bash
        working-directory: agent
        run: |
          # Ensure the license reaches rasa even though .env ships empty
          # (later keys win in dotenv; append rather than clobber).
          printf 'RASA_LICENSE=%s\n' "$RASA_LICENSE" >> .env
          uv run rasa data validate
