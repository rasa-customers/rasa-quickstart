name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Ruff (lint Python)
        # Pinned: ruff 0.16 expanded the default rule set and fails this repo.
        run: uvx ruff@0.15.0 check template/scripts scripts tests

      - name: ShellCheck (install.sh)
        run: shellcheck install.sh

      - name: PSScriptAnalyzer (install.ps1)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Output "PSScriptAnalyzer clean"

      - name: Unit tests
        run: uv run --no-project --with pytest --with ruamel.yaml python -m pytest tests/ -q
